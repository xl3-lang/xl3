name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
        if: matrix.node-version == '20.x'
      - run: npm run format:check
        if: matrix.node-version == '20.x'
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:bundle
      - run: npm test
      - run: npm run test:coverage
        if: matrix.node-version == '20.x'
      - run: npm run conformance
      # ROADMAP gate G11: Stage 2 OOXML canonicalization in CI. Runs
      # the Stage 2 superset that includes merge / outline-level /
      # styles checks. The default `npm run conformance` skips Stage 2
      # fixtures; this command opts in.
      - run: npm run conformance:stage2

  cross-browser:
    # ROADMAP gate G10: the bundle has to load and convert in a real
    # browser engine, not just in the Node `vm` sandbox that
    # iife-bundle.test.ts uses. That sandbox hand-shims TextEncoder,
    # Blob, crypto, a fake `process` and more — a dependency reaching
    # for something only Node has passes there and fails in a browser,
    # which is exactly what /try on xl3.io ships to users.
    #
    # `webkit` is the WebKit engine Safari is built on, headless on
    # Linux. Standard CI proxy for Safari; not Safari-the-application,
    # so a Safari-specific UI bug is still out of scope.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:bundle
      # --with-deps pulls the system libraries the engines need on the
      # runner image; without it webkit fails to launch.
      - run: npx playwright install --with-deps webkit firefox
      - run: npm run browser:smoke

  conformance-timezones:
    # ADR-0017 declares Date semantics UTC-normative. Run conformance
    # under three distinct timezones so any future regression that
    # leaks the host TZ into output values is caught at PR time.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [UTC, America/New_York, Asia/Seoul]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run conformance

  docs-and-examples:
    # Keep the user-facing contract and runnable examples gated on PRs,
    # rather than discovering a broken locale only after main deploys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run docs:build
      # Exercise the built React page, including its default sample download
      # and initial __inputs__ discovery. The cross-browser job above covers
      # the engine bundle; this covers the actual user workflow.
      - run: npx playwright install --with-deps chromium
      - run: npm run browser:e2e
      # Production-shaped workbook corpus: render and assert filenames,
      # sheets, merges, ordering, derived values, and totals.
      - run: npm run operational:regression
